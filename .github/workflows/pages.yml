name: Publicar no GitHub Pages

# O Pages deste repositório serve a branch gh-pages. Este workflow
# regenera essa branch a partir da main a cada push, para que o site
# publicado acompanhe o conteúdo versionado aqui.
#
# A rota via actions/deploy-pages não é usada porque o GITHUB_TOKEN do
# app não consegue criar o site do Pages ("Resource not accessible by
# integration"), e a fonte configurada é a branch.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerar a branch gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          site="$(mktemp -d)"
          cp -r index.html .nojekyll assets data "$site/"

          # Carimba o commit nas URLs dos arquivos. Sem isso, o navegador
          # continua servindo CSS e JS antigos depois de um deploy novo.
          sed -i "s/?v=dev/?v=${GITHUB_SHA:0:7}/g" "$site/index.html"

          cd "$site"
          git init --quiet --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet -m "Publica ${GITHUB_SHA:0:7}"
          git push --force --quiet \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
